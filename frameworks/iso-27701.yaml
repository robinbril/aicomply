framework: "ISO/IEC 27701 Privacy information management (PIMS)"
reference: "ISO/IEC 27701:2025"
short: "ISO 27701"
kind: "iso"
source: "iso-27701"
scope: "Privacy information management extending ISO 27001 for controllers and processors of personal data in AI/LLM software. The current edition is the 2025 standalone privacy management system standard (the 2019 version is withdrawn); control ids keep their legacy 2019-style names (P.7.x controller, P.8.x processor) and clause fields cite the 2025 structure only at heading level."
controls:
  - id: "P.7.2.1-LAWFUL"
    title: "PII processing: lawful basis and purpose"
    part: "Controller conditions"
    clause: "Annex A (controller)"
    requirement: "Determine and document the purpose and lawful basis for processing PII, and limit processing to that purpose."
    applies_when: "processing personal data (as controller)"
    severity: critical
    weight: 5
    check: "Each processing purpose has a documented lawful basis; PII is not used beyond the stated purpose; data minimization applied."
    evidence: "Record of processing activities (RoPA), lawful-basis register."
    advice: "Maintain a RoPA, document a lawful basis per purpose, drop PII fields not needed for the purpose."
    owner: "DPO"

  - id: "P.7.4.2-DPIA"
    title: "Privacy risk assessment"
    part: "Controller conditions"
    clause: "Annex A (controller)"
    requirement: "Assess privacy risks (DPIA) for high-risk processing before deployment."
    applies_when: "high-risk processing, e.g. large-scale PII, profiling, or sensitive categories via AI"
    severity: medium
    weight: 2
    check: "DPIA completed for high-risk processing, identifying risks and mitigations; reviewed before go-live."
    evidence: "DPIA document with risk register and sign-off."
    advice: "Run a DPIA before deploying high-risk AI processing, record mitigations, get sign-off."
    owner: "DPO"

  - id: "P.7.3-DSR"
    title: "PII principal rights"
    part: "Data subject obligations"
    clause: "Annex A (controller)"
    requirement: "Enable data subjects to exercise access, correction, erasure and objection rights."
    applies_when: "processing personal data of identifiable individuals (as controller)"
    severity: high
    weight: 3
    check: "Documented process to handle access/erasure/correction requests within statutory deadlines; ability to locate and delete a subject's PII."
    evidence: "DSR procedure, request log, deletion confirmation records."
    advice: "Build a request intake and a reliable way to find and delete a subject's data across stores and model logs."
    owner: "DPO"

  - id: "P.7.4.5-RETENTION"
    title: "PII retention and disposal"
    part: "Privacy by design"
    clause: "Annex A (controller)"
    requirement: "Retain PII only as long as necessary and dispose of it securely."
    applies_when: "storing personal data, including prompts/responses containing PII"
    severity: high
    weight: 3
    check: "Retention periods defined per data type; automated or scheduled deletion; LLM prompt/response logs containing PII covered by retention rules."
    evidence: "Retention schedule, deletion job logs."
    advice: "Set retention periods, automate deletion, ensure PII in model logs is not retained indefinitely."
    owner: "Engineering lead"

  - id: "P.8.5-PROCESSOR"
    title: "Processor obligations and subprocessors"
    part: "Processor obligations"
    clause: "Annex A (processor)"
    requirement: "As processor, process PII only on documented controller instructions and disclose subprocessors, including LLM vendors."
    applies_when: "acting as a processor on behalf of a customer/controller"
    severity: high
    weight: 3
    check: "DPA in place; processing limited to instructions; subprocessor list (incl. model providers) disclosed and authorized; cross-border transfers safeguarded."
    evidence: "Signed DPA, subprocessor register, transfer mechanism (SCCs/adequacy)."
    advice: "Sign a DPA, publish a subprocessor list including LLM vendors, secure a transfer mechanism for non-adequate regions."
    owner: "Legal"

  - id: "P.7.2.4-CONSENT"
    title: "Consent determination and records"
    part: "Controller conditions"
    clause: "Annex A (controller)"
    requirement: "Where consent is the lawful basis, determine when and how it is obtained and keep a record of each consent given."
    applies_when: "controller relying on consent, for example optional analytics or use of data to improve models"
    severity: high
    weight: 3
    check: "Consent is specific and recorded with time, scope and wording version; withdrawal is as easy as giving consent; consent is not bundled."
    evidence: "Consent log schema and sample records, consent UI copy versions."
    advice: "Store a consent record per person and purpose, and wire withdrawal to stop the processing."
    owner: "DPO"

  - id: "P.7.2.8-ROPA"
    title: "Records of processing and PII inventory"
    part: "Controller conditions"
    clause: "Annex A (controller)"
    requirement: "Keep records of processing PII sufficient to show compliance, including an inventory of where PII is stored and which systems and vendors touch it."
    applies_when: "controller processing personal data"
    severity: high
    weight: 3
    check: "Records list purposes, categories, recipients, transfers and retention; the inventory includes prompt and response logs, vector stores and vendor systems; it was reviewed in the last year."
    evidence: "Record of processing activities, data inventory or data-flow map."
    advice: "Create the record from actual data flows, include AI-specific stores and review it yearly."
    owner: "DPO"

  - id: "P.7.3.3-NOTICE"
    title: "Privacy notices and information to PII principals"
    part: "Data subject obligations"
    clause: "Annex A (controller)"
    requirement: "Determine what information PII principals need and provide clear, timely privacy information, including the use of AI and external model providers."
    applies_when: "controller processing personal data of identifiable individuals"
    severity: high
    weight: 3
    check: "Notice states purposes, lawful basis, recipients (including LLM vendors), transfers, retention and rights; it is given at or before collection and is kept current."
    evidence: "Privacy notice with version history, in-product notice placement."
    advice: "Publish an accurate notice that names AI processing and vendors and update it when processing changes."
    owner: "DPO"

  - id: "P.7.3.10-ADM"
    title: "Automated decision-making safeguards"
    part: "Data subject obligations"
    clause: "Annex A (controller)"
    requirement: "Identify processing that makes decisions about individuals solely by automated means and provide the legally required safeguards and information."
    applies_when: "AI system that scores, ranks or decides about people"
    severity: high
    weight: 3
    check: "Decisions with legal or similarly significant effect are inventoried; a human review path, explanation and challenge route exist."
    evidence: "Automated-decision inventory, human review procedure, explanation text."
    advice: "List automated decisions about people and add human review and a contest route for significant ones."
    owner: "DPO"

  - id: "P.7.4.1-MINIMISE"
    title: "Collection limitation and minimisation"
    part: "Privacy by design"
    clause: "Annex A (controller)"
    requirement: "Limit collection and processing to what is adequate and necessary, keep PII accurate and set minimisation objectives."
    applies_when: "system collecting or forwarding personal data, including data placed in prompts"
    severity: medium
    weight: 2
    check: "Each PII field has a documented need; prompts and logs exclude unneeded PII; data quality checks exist."
    evidence: "Data field justification list, prompt templates, minimisation objectives."
    advice: "Remove or redact PII fields not needed for the purpose and set measurable minimisation targets."
    owner: "Engineering lead"

  - id: "P.7.5-TRANSFER"
    title: "Transfers and disclosure to third parties"
    part: "Sharing and transfer"
    clause: "Annex A (controller)"
    requirement: "Identify the basis for transferring PII across jurisdictions, the countries involved, and keep records of transfers and disclosures to third parties."
    applies_when: "PII is sent to processors, model providers or regions outside the original jurisdiction"
    severity: high
    weight: 3
    check: "Each transfer has a documented legal mechanism; destination countries are listed; transfers and disclosures are logged."
    evidence: "Transfer register with mechanism (adequacy, SCCs), disclosure log."
    advice: "Register every cross-border transfer with its legal basis and keep a log of third-party disclosures."
    owner: "Legal"

  - id: "P.8.2.6-PROC-RECORDS"
    title: "Processor records of processing"
    part: "Processor obligations"
    clause: "Annex A (processor)"
    requirement: "As processor, maintain records of the processing carried out for each customer to show compliance."
    applies_when: "acting as a processor on behalf of a customer"
    severity: medium
    weight: 2
    check: "A per-customer record lists categories, instructions, subprocessors, transfers and security measures."
    evidence: "Processor record of processing, per-customer instruction log."
    advice: "Keep a processor record per customer and update it when instructions or subprocessors change."
    owner: "DPO"

  - id: "P.8.4.2-RETURN"
    title: "Return, transfer or disposal of customer PII"
    part: "Processor obligations"
    clause: "Annex A (processor)"
    requirement: "Provide the ability to return, transfer or securely dispose of the customer PII at contract end or on instruction."
    applies_when: "acting as a processor on behalf of a customer"
    severity: high
    weight: 3
    check: "A documented export and deletion process exists, covers backups, logs and embeddings, and issues a deletion confirmation."
    evidence: "Offboarding procedure, deletion certificates, export format description."
    advice: "Build and test a tenant export and purge, and give the customer confirmation."
    owner: "Engineering lead"

  - id: "P.8.5.7-SUBPROC-CHANGE"
    title: "Subprocessor engagement and change notice"
    part: "Processor obligations"
    clause: "Annex A (processor)"
    requirement: "Engage subprocessors only with customer authorisation and inform customers of intended changes so they can object."
    applies_when: "acting as a processor and using subprocessors, including LLM vendors"
    severity: high
    weight: 3
    check: "Contract terms require authorisation; customers are notified in advance of new or replaced subprocessors; flow-down terms are in place."
    evidence: "Notice records, subprocessor contract terms, customer objection log."
    advice: "Give customers advance notice of subprocessor changes and sign flow-down terms."
    owner: "Legal"

  - id: "P.6.13-BREACH-CONTROLLER"
    title: "Breach notification to the controller"
    part: "Processor obligations"
    clause: "Annex A (processor)"
    requirement: "As processor, detect personal data breaches and notify the controller without undue delay with the information it needs to meet its own deadlines."
    applies_when: "acting as a processor on behalf of a customer"
    severity: critical
    weight: 5
    check: "The incident procedure covers customer PII, names a contact and a notification time limit, and is tested; contracts state the notification window."
    evidence: "Incident response plan section, customer notification template, DPA clause."
    advice: "Define a customer breach notification path with a short fixed deadline and test it."
    owner: "CISO"
