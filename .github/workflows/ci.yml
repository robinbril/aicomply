name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m aicomply validate
      - run: python -m unittest discover -s tests -t . -v
      - name: Example audit still builds
        run: |
          python -m aicomply egress examples/demo-app --out /tmp/egress.json
          python -m aicomply audit --findings examples/findings.json --egress /tmp/egress.json \
            --system "Acme CV screening assistant" --date 2026-11-03 --out /tmp/audit || test $? -eq 1
          test -s /tmp/audit/risk-matrix.html
